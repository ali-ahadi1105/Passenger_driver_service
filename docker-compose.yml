version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL – Primary Database
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_pass}
      POSTGRES_DB: ${POSTGRES_DB:-taxi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxi_user} -d ${POSTGRES_DB:-taxi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

  # ──────────────────────────────────────────────
  # Redis – Caching / Session Store / Queue
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taxi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

  # ──────────────────────────────────────────────
  # RabbitMQ – Message Broker
  # ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: taxi-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"       # AMQP
      - "15672:15672"     # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-taxi_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-taxi_rabbit_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

  # ──────────────────────────────────────────────
  # MinIO – S3-Compatible Object Storage
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: taxi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taxi_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-taxi_minio_pass}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  taxi-network:
    driver: bridge
